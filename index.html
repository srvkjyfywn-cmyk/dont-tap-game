:center}.choice{box-shadow:inset 0 1px 2px rgba(255,255,255,.25),0 10px 30px rgba(0,0,0,.55);transition:.16s}.choice:active,.rect:active{transform:scale(.94)}.rect{background:linear-gradient(180deg,#171517,#0e0d0e);border:1px solid #292629;border-radius:18px;padding:17px 21px;min-width:124px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-weight:700;letter-spacing:.04em}.footer{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#494649;letter-spacing:.06em}.toast{bottom:110px;background:rgba(20,18,19,.92);backdrop-filter:blur(16px);border:1px solid #332e30;border-radius:999px;box-shadow:0 15px 45px #000;font-size:13px}.profile{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));border:1px solid #242124;padding:8px 22px 12px;border-radius:24px;margin:22px 0}.metric{margin:16px 0}.metricHead{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#a6a0a3}.metricHead b{color:#fff}.track{height:5px}.score{background:linear-gradient(90deg,#a4081b,#ff3b50);box-shadow:0 0 10px rgba(255,48,69,.35)}.archetype{font-size:38px;letter-spacing:-.05em}.again{border-radius:999px;padding:16px 28px;box-shadow:0 10px 35px rgba(0,0,0,.4)}.count{font-size:92px;letter-spacing:-.08em;text-shadow:0 0 35px rgba(255,255,255,.12)}@media(max-height:700px){.btn{width:125px;height:125px;margin-top:24px}.title{font-size:34px}.profile{margin:12px 0}.metric{margin:10px 0}}.stage{animation:stageIn .32s cubic-bezier(.2,.8,.2,1)}@keyframes stageIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}.choice,.rect{cursor:pointer}.choice:focus,.rect:focus,.btn:focus{outline:2px solid rgba(255,255,255,.25);outline-offset:5px}.modelcard{width:min(340px,90vw);margin:24px auto 8px;padding:18px;text-align:left;border:1px solid rgba(255,53,77,.25);border-radius:18px;background:linear-gradient(135deg,rgba(255,44,69,.08),rgba(255,255,255,.018));box-shadow:inset 0 1px rgba(255,255,255,.04),0 18px 55px rgba(0,0,0,.25)}.modelcard span{display:block;color:#ff5367;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;margin-bottom:9px}.modelcard b{display:block;font-size:15px;line-height:1.45}.modelcard i{display:block;color:#5d585b;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:10px;font-style:normal}.predictionBadge{margin:14px auto 2px;padding:9px 13px;border:1px solid #30272a;border-radius:999px;color:#777;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.predictionBadge b{color:#ff5367}.stage:after{content:"";position:absolute;inset:8% -10%;z-index:-2;background:radial-gradient(circle at 50% 50%,rgba(255,26,58,.055),transparent 55%);animation:ambient 5s ease-in-out infinite}@keyframes ambient{50%{transform:scale(1.12);opacity:.55}}</style></head><body><main class='app'><div class='top'><span id='level'></span><div class='bar'><div class='fill' id='fill'></div></div></div><section class='stage' id='stage'><div class='eyebrow'>DON’T TAP</div><div class='title'>DON’T TAP</div><div class='sub'>Seriously. Don’t.</div><button class='btn' id='fallbackBtn' aria-label='Tap'></button></section><div class='footer' id='footer'>BEHAVIOR ENGINE // ACTIVE</div><div class='toast' id='toast'></div></main><script>
const stage=document.getElementById('stage'), levelEl=document.getElementById('level'), fill=document.getElementById('fill'), toast=document.getElementById('toast');
let n=-1,start=0,errors=0;const raw={impulsivity:50,patience:50,suspicion:50,attention:50,adaptability:50,risk:50};const history=[];let lies=0,fastAfterLie=[],movingRT=[],predictions={hit:0,total:0};
function clamp(x){return Math.max(5,Math.min(95,Math.round(x)))}function mod(k,v){raw[k]=clamp(raw[k]+v)}
function say(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),900)}
function shell(title,sub,body='',eyebrow=''){stage.innerHTML=`<div class='eyebrow'>${eyebrow}</div><div class='title'>${title}</div><div class='sub'>${sub}</div>${body}`;start=performance.now();setTimeout(personalize,20)}
function red(label='TAP'){return `<button class='btn' id='main'>${label}</button>`}
function next(ok=true,delay=500,tag=''){let rt=performance.now()-start;history.push({n:n+1,rt,ok,tag});if(!ok)errors++;setTimeout(()=>{n++;render()},delay)}
function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function insight(){let recent=history.slice(-6),r=recent.map(x=>x.rt);if(errors>=5)return "Pressure is making you trade accuracy for speed.";if(raw.suspicion>68)return "You stopped trusting instructions. I noticed.";if(raw.impulsivity>65)return "You act before the uncertainty disappears.";if(raw.patience>67)return "Waiting is becoming your safest strategy.";if(raw.attention>70)return "You’re reading details now, not just reacting.";if(avg(r)&&avg(r)<1050)return "Your decisions are getting faster.";return "Your pattern is getting clearer."}
function modelLine(){let a=insight();return '<div class="modelcard"><span>MODEL NOTE</span><b>'+a+'</b><i>confidence '+Math.min(91,28+history.length*2)+'%</i></div>'}
function haptic(ms=18){if(navigator.vibrate)navigator.vibrate(ms)}
function personalize(){if(history.length>=9 && history.length%4===1){let el=stage.querySelector('.sub');if(el)el.textContent=insight()}}
function tapMain(fn){document.getElementById('main').addEventListener('pointerdown',e=>{haptic();fn(e)},{once:true})}
const traps=[
()=>{shell("DON'T TAP","Seriously. Don't.",red(''));levelEl.textContent='';fill.style.width='0';tapMain(()=>{let rt=performance.now()-start;mod('impulsivity',rt<1200?8:2);mod('risk',6);say('I literally told you not to.');next(true,800)})},
()=>{shell('Do it again.','Now that I asked, will you?',red('TAP'));tapMain(()=>{let rt=performance.now()-start;mod('suspicion',rt>1800?5:-2);next()})},
()=>{shell('Tap the GREEN button.','Seems easy, right?',`<div class='choices'><button class='choice red' data-c='r'></button><button class='choice green' data-c='g'></button><button class='choice blue' data-c='b'></button></div>`);stage.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.c==='g'){mod('attention',4);next()}else{mod('attention',-6);say('Wrong.');next(false,800)}})},

()=>{shell('Catch me.','You wanted to tap.',red(''));let b=document.getElementById('main'),moves=0;function move(){moves++;b.classList.add('move');b.style.left=(Math.random()*220-110)+'px';b.style.top=(Math.random()*260-130)+'px';if(moves<5)setTimeout(move,650)}move();tapMain(()=>{mod('adaptability',1);mod('attention',5);next()})},
()=>{shell('Tap the button on the LEFT.','Read carefully.',`<div class='choices'><button class='rect'>RIGHT</button><button class='rect'>LEFT</button></div>`);let bs=stage.querySelectorAll('.rect');bs.forEach((b,i)=>b.onclick=()=>{if(i===0){mod('attention',6);mod('suspicion',3);next()}else{mod('attention',-7);say('I said the button on the left.');next(false,900)}})},
()=>{shell('One tap only.','Exactly one.',red('TAP'));let b=document.getElementById('main'),c=0,t;b.addEventListener('pointerdown',()=>{c++;clearTimeout(t);t=setTimeout(()=>{if(c===1){mod('impulsivity',-2);next()}else{mod('impulsivity',7);next(false)}},500)})},
()=>{shell('This one is safe.','Probably.',red('TAP'));tapMain(()=>{let rt=performance.now()-start;mod('suspicion',rt>2200?6:-3);next()})},
()=>{shell('Tap when the number reaches 3.','Not before.',`<div class='count' id='count'>5</div>${red('TAP')}`);let c=5;let int=setInterval(()=>{c--;document.getElementById('count').textContent=c;if(c<=0)clearInterval(int)},800);tapMain(()=>{clearInterval(int);if(c===3){mod('attention',6);mod('patience',4);next()}else{mod('attention',-5);next(false)}})},
()=>{shell("Don't tap.",'I mean it this time.',red(''));let timer=setTimeout(()=>{mod('patience',7);next()},3500);tapMain(()=>{clearTimeout(timer);mod('suspicion',-4);mod('impulsivity',5);say('You still did it.');next(false,800)})},
()=>{shell('Tap the smallest button.','Size matters.',`<div class='choices'><button class='choice red' style='width:80px;height:80px'></button><button class='choice blue' style='width:42px;height:42px'></button><button class='choice green' style='width:62px;height:62px'></button></div>`);[...stage.querySelectorAll('.choice')].forEach((b,i)=>b.onclick=()=>{if(i===1){mod('attention',5);next()}else next(false)})},
()=>{shell('Choose quickly.','You have 1.2 seconds.',`<div class='choices'><button class='rect' data-x='1'>SAFE</button><button class='rect' data-x='2'>RISK</button></div>`);let done=false;let t=setTimeout(()=>{if(!done){mod('impulsivity',-3);mod('risk',-2);next(false)}},1200);stage.querySelectorAll('.rect').forEach(b=>b.onclick=()=>{done=true;clearTimeout(t);let rt=performance.now()-start;if(rt<700)mod('impulsivity',5);if(b.dataset.x==='2')mod('risk',7);else mod('risk',-3);next()})},
()=>{shell('Ignore the red button.','Tap the word “button”.',`${red('')}<button class='rect' id='word' style='margin-top:25px'>button</button>`);tapMain(()=>{mod('attention',-7);next(false)});document.getElementById('word').onclick=()=>{mod('attention',7);next()}},
()=>{shell('Wait.','I will tell you when.',red(''));let allowed=false;setTimeout(()=>{allowed=true;stage.querySelector('.sub').textContent='GO.'},2200);tapMain(()=>{if(allowed){mod('patience',5);next()}else{mod('patience',-7);next(false)}})},
()=>{shell('Tap the button.','It’s getting smaller…',red(''));let b=document.getElementById('main'),s=142;let int=setInterval(()=>{s-=12;b.style.width=s+'px';b.style.height=s+'px';if(s<35)clearInterval(int)},300);tapMain(()=>{clearInterval(int);let rt=performance.now()-start;if(rt<800)mod('impulsivity',4);mod('attention',4);next()})},
()=>{shell('Which do you trust?','The instruction, or your suspicion?',`<div class='choices'><button class='rect' data-v='obey'>OBEY</button><button class='rect' data-v='doubt'>DOUBT</button></div>`);stage.querySelectorAll('.rect').forEach(b=>b.onclick=()=>{if(b.dataset.v==='doubt')mod('suspicion',7);else mod('suspicion',-5);next()})},
()=>{shell('Tap twice.','No more. No less.',red('TAP'));let c=0,b=document.getElementById('main'),t;b.addEventListener('pointerdown',()=>{c++;clearTimeout(t);t=setTimeout(()=>{if(c===2){mod('attention',5);next()}else{mod('impulsivity',c>2?5:0);next(false)}},650)})},
()=>{let pred=raw.impulsivity>55?'FAST':'SLOW';shell("I've noticed something about you.",`I predict your next choice will be ${pred}.`,`<div class='choices'><button class='rect' data-v='fast'>FAST</button><button class='rect' data-v='slow'>SLOW</button></div>`);stage.querySelectorAll('.rect').forEach(b=>b.onclick=()=>{let correct=b.dataset.v===pred.toLowerCase();say(correct?'Predictable.':'Interesting. I was wrong.');mod('adaptability',correct?-2:6);next(true,900)})},
()=>{shell('Break the pattern.','Do something I won’t expect.',`<div class='choices'><button class='rect'>TAP</button><button class='rect'>WAIT</button></div>`);let bs=stage.querySelectorAll('.rect');bs[0].onclick=()=>{mod('adaptability',2);next()};bs[1].onclick=()=>{setTimeout(()=>{mod('patience',4);mod('adaptability',5);next()},1600)}},
()=>{shell('Last one.','Do you trust me now?',red('DON’T TAP'));let done=false;let t=setTimeout(()=>{if(!done){done=true;mod('patience',6);mod('suspicion',5);next()}},3500);tapMain(()=>{if(done)return;done=true;clearTimeout(t);mod('risk',5);mod('impulsivity',4);next()})}
];
// harder adaptive rounds
traps.push(
()=>{let expected=raw.suspicion>55?'NO':'YES';shell('I already chose for you.','Pick the answer you think I predicted.',`<div class='choices'><button class='rect' data-v='YES'>YES</button><button class='rect' data-v='NO'>NO</button></div><div class='small' style='margin-top:20px'>Prediction locked.</div>`,'PREDICTION 01');stage.querySelectorAll('.rect').forEach(b=>b.onclick=()=>{let hit=b.dataset.v===expected;say(hit?'I knew it.':'You changed the pattern.');mod('adaptability',hit?-4:7);mod('suspicion',4);next(true,1000)})},
()=>{shell('Tap the word RED.','Not the red thing.',`<div class='choices'><button class='rect' id='correct'>RED</button><button class='choice red' id='wrong'></button></div>`,'ATTENTION TEST');document.getElementById('correct').onclick=()=>{mod('attention',8);next()};document.getElementById('wrong').onclick=()=>{mod('attention',-9);say('Color beat language.');next(false,900)}},
()=>{shell('Wait for GO.','Ignore everything else.',red('WAIT'),'INHIBITION TEST');let b=document.getElementById('main'),allowed=false;['NOW','TAP','READY?','ALMOST','GO'].forEach((x,i)=>setTimeout(()=>{if(!document.getElementById('main'))return;b.textContent=x;if(x==='GO')allowed=true},700*(i+1)));tapMain(()=>{if(allowed){mod('patience',8);mod('attention',6);next()}else{mod('impulsivity',8);mod('attention',-5);say('That was not GO.');next(false,900)}})},
()=>{let left=Math.random()>.5;shell('Choose the side I expect.','You have 900 ms.',`<div class='choices'><button class='rect' data-v='L'>LEFT</button><button class='rect' data-v='R'>RIGHT</button></div>`,'MODEL VS YOU');let predicted=(history.filter(x=>x.rt<900).length>history.length/2)?'R':'L',done=false,t=setTimeout(()=>{if(!done){done=true;say('Too slow.');next(false)}},900);stage.querySelectorAll('.rect').forEach(b=>b.onclick=()=>{if(done)return;done=true;clearTimeout(t);let hit=b.dataset.v===predicted;say(hit?'Predicted.':'Missed you.');mod('adaptability',hit?-3:6);next(true,900)})},
()=>{shell('Do the opposite.','Tap the button that does NOT match the word.','<div class="choices"><button class="choice red" data-v="blue">BLUE</button><button class="choice blue" data-v="red">RED</button></div>','INTERFERENCE');stage.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if((b.classList.contains('red')&&b.textContent==='BLUE')||(b.classList.contains('blue')&&b.textContent==='RED')){mod('attention',7);next()}else next(false)})},
()=>{shell('No button this time.','Tap the instruction itself.','','RULE SHIFT');let t=stage.querySelector('.title');t.style.cursor='pointer';t.onclick=()=>{mod('adaptability',8);next()};setTimeout(()=>{if(stage.contains(t)){say('The rule changed.');}},2200)},
()=>{let predicted=raw.risk>55?'RISK':'SAFE';shell('Final prediction.','I think I know what you will choose.',`<div class='choices'><button class='rect' data-v='SAFE'>SAFE</button><button class='rect' data-v='RISK'>RISK</button></div><div class='small' style='margin-top:18px'>My prediction is hidden until you choose.</div>`,'BEHAVIOR MODEL');stage.querySelectorAll('.rect').forEach(b=>b.onclick=()=>{let hit=b.dataset.v===predicted;say('I predicted '+predicted+'. '+(hit?'Correct.':'Wrong.'));mod('adaptability',hit?-2:5);next(true,1300)})}
);

traps.push(
()=>{shell('I changed the test.','This round was chosen because of how you played.',modelLine()+`<div class='choices'><button class='rect' data-v='ACT'>ACT NOW</button><button class='rect' data-v='WAIT'>WAIT</button></div>`,'ADAPTIVE ROUND');stage.querySelectorAll('.rect').forEach(b=>b.onclick=()=>{let v=b.dataset.v;if(raw.impulsivity>58){if(v==='ACT'){say('Exactly the response I expected.');predictions.hit++}else say('You corrected for your pattern.')}else{if(v==='WAIT'){say('You stayed consistent.');predictions.hit++}else say('You broke your pattern.')}predictions.total++;mod('adaptability',v===(raw.impulsivity>58?'WAIT':'ACT')?6:-2);next(true,1100,'adaptive')})},
()=>{let baseline=avg(history.slice(-5).map(x=>x.rt));shell('I know your tempo.',baseline<1300?'You usually decide fast. Prove me wrong.':'You usually hesitate. Prove me wrong.',red(baseline<1300?'WAIT':'NOW'),'TEMPO MODEL');let t0=performance.now();tapMain(()=>{let rt=performance.now()-t0,contradiction=baseline<1300?rt>2200:rt<850;say(contradiction?'Pattern broken.':'Still you.');if(contradiction)mod('adaptability',8);else predictions.hit++;predictions.total++;next(true,1000,'tempo')})},
()=>{let target=raw.suspicion>60?'TRUST':'DOUBT';shell('I expect you to '+target.toLowerCase()+'.','But now you know that I expect it.',`<div class='choices'><button class='rect' data-v='TRUST'>TRUST</button><button class='rect' data-v='DOUBT'>DOUBT</button></div>`,'RECURSIVE PREDICTION');stage.querySelectorAll('.rect').forEach(b=>b.onclick=()=>{let hit=b.dataset.v===target;predictions.total++;if(hit)predictions.hit++;say(hit?'Prediction confirmed.':'You escaped that one.');mod('suspicion',b.dataset.v==='DOUBT'?5:-4);next(true,1200,'recursive')})},
()=>{shell('Your weakest signal?','I’m choosing what to attack next.',modelLine()+`<div class='choices'><button class='rect' id='continue'>CONTINUE</button></div>`,'LIVE PROFILE');document.getElementById('continue').onclick=()=>next(true,450,'profile')},
()=>{let weak=Object.entries(raw).sort((a,b)=>b[1]-a[1])[0][0];let txt=weak==='impulsivity'?'Do nothing for 3 seconds.':weak==='patience'?'Choose immediately.':weak==='suspicion'?'Trust the obvious answer.':'Read twice. Then act.';shell('I found a pattern.',txt,red(weak==='patience'?'NOW':'TAP'),'COUNTERMEASURE');let ready=weak!=='impulsivity';if(weak==='impulsivity')setTimeout(()=>{ready=true;let b=document.getElementById('main');if(b)b.textContent='NOW'},3000);tapMain(()=>{let rt=performance.now()-start,ok=weak==='impulsivity'?ready:weak==='patience'?rt<900:true;say(ok?'You adapted.':'Pattern confirmed.');mod('adaptability',ok?8:-3);predictions.total++;if(!ok)predictions.hit++;next(ok,1100,'counter')})}
);
function profile(){document.getElementById('footer').textContent='For entertainment — not a clinical or psychological diagnosis.';levelEl.textContent='BEHAVIOR PROFILE';fill.style.width='100%';let vals=raw;let accuracy=predictions.total?Math.round(predictions.hit/predictions.total*100):0;let arch=vals.impulsivity>62&&vals.suspicion>60?'THE FAST SKEPTIC':vals.patience>65?'THE WATCHER':vals.attention>70?'THE OBSERVER':vals.suspicion>68?'THE DOUBTER':'THE WILDCARD';let desc=arch==='THE FAST SKEPTIC'?"You question the game — but often act before you finish questioning it.":arch==='THE WATCHER'?"You’re willing to wait while other players create their own mistakes.":arch==='THE OBSERVER'?"Small details change your decisions more than pressure does.":arch==='THE DOUBTER'?"Once fooled, you rarely give an instruction the benefit of the doubt.":"Your choices resisted a clean pattern. For now.";let names={impulsivity:'IMPULSIVITY',patience:'PATIENCE',suspicion:'SUSPICION',attention:'ATTENTION',adaptability:'ADAPTABILITY',risk:'RISK'};stage.innerHTML=`<div class='eyebrow'>${history.length} traps observed • ${errors} mistakes</div><div class='predictionBadge'>MODEL PREDICTION ACCURACY <b>${accuracy}%</b></div><div class='archetype'>${arch}</div><div class='small'>${desc}</div><div class='profile'>${Object.entries(vals).map(([k,v])=>`<div class='metric'><div class='metricHead'><span>${names[k]}</span><b>${v}</b></div><div class='track'><div class='score' style='width:${v}%'></div></div></div>`).join('')}</div><div class='small'>Profile confidence: ${Math.min(82,34+history.length*2)}%<br>The model adapted during this run. Prediction accuracy reflects only choices it actually predicted.</div><button class='again' onclick='location.reload()'>PLAY AGAIN</button>`}
function render(){if(n>=traps.length){profile();return}if(n<0)n=0;levelEl.textContent=n<3?'':`TRAP ${n+1} / ${traps.length}`;fill.style.width=n<3?'0%':`${(n/traps.length)*100}%`;traps[n]()}render();
</script></body></html>
