<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><meta name='apple-mobile-web-app-capable' content='yes'><title>DON'T TAP</title><style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#f7f3ee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow:hidden}.app{min-height:100vh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 24px);position:relative}.top{display:flex;justify-content:space-between;align-items:center;color:#777;font-size:13px}.bar{height:3px;background:#202020;border-radius:3px;flex:1;margin-left:15px;overflow:hidden}.fill{height:100%;background:#ff3838;width:0;transition:.3s}.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}.eyebrow{font-size:13px;letter-spacing:.16em;color:#888;text-transform:uppercase}.title{font-size:32px;line-height:1.12;font-weight:700;max-width:340px;margin:14px 0 8px}.sub{font-size:16px;line-height:1.5;color:#999;max-width:330px;min-height:50px}.btn{width:142px;height:142px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff6666,#ef2020 55%,#a90000);box-shadow:0 0 0 7px #210707,0 16px 35px #000,0 0 32px rgba(255,30,30,.25);margin-top:40px;color:white;font-weight:800;font-size:18px;touch-action:manipulation;transition:.18s transform,.18s left,.18s top,.18s width,.18s height;position:relative}.btn:active{transform:scale(.94)}.choices{display:flex;gap:18px;margin-top:35px}.choice{width:92px;height:92px;border-radius:50%;border:0;box-shadow:0 0 0 5px #151515;color:#fff;font-weight:800}.green{background:#22c55e}.red{background:#ef3038}.blue{background:#2684ff}.rect{border:1px solid #333;background:#121212;color:#eee;border-radius:16px;padding:18px 22px;font-size:17px;min-width:130px}.footer{height:70px;text-align:center;color:#555;font-size:12px}.toast{position:absolute;bottom:95px;left:50%;transform:translateX(-50%);background:#161616;border:1px solid #292929;padding:12px 18px;border-radius:14px;color:#ddd;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1}.profile{width:100%;max-width:380px;text-align:left}.metric{margin:18px 0}.metricHead{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.08em}.track{height:8px;background:#1c1c1c;border-radius:8px;margin-top:8px;overflow:hidden}.score{height:100%;background:#ff3838;border-radius:8px}.archetype{font-size:28px;font-weight:800;text-align:center;margin:20px 0 8px}.small{text-align:center;color:#888;line-height:1.45}.again{margin:28px auto 0;display:block;background:#f3eee8;color:#111;border:0;border-radius:14px;padding:15px 24px;font-weight:750}.count{font-size:76px;font-weight:800;margin-top:25px}.move{position:absolute;margin:0}.hidden{display:none!important}
:root{--red:#ff3045}body{background:radial-gradient(circle at 50% 42%,#171014 0,#090708 34%,#030303 72%);letter-spacing:-.01em}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);background-size:24px 24px}.app{max-width:520px;margin:auto;padding-left:28px;padding-right:28px}.top{height:28px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.bar{height:2px;background:#1b1819}.fill{background:linear-gradient(90deg,#ff2140,#ff6375);box-shadow:0 0 12px rgba(255,48,69,.7)}.stage{perspective:900px}.stage:before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,32,62,.045);filter:blur(45px);z-index:-1}.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.28em;color:#696568}.title{font-size:clamp(36px,10vw,54px);letter-spacing:-.055em;font-weight:850;margin:16px 0 12px;text-wrap:balance;text-shadow:0 2px 25px rgba(255,255,255,.04)}.sub{font-size:16px;color:#858084;min-height:48px;max-width:300px}.btn{width:154px;height:154px;background:radial-gradient(circle at 38% 28%,#ff6977 0,#ff3045 26%,#e5102a 62%,#85000f 100%);box-shadow:inset 0 2px 3px rgba(255,255,255,.28),inset 0 -9px 16px rgba(80,0,8,.35),0 0 0 1px #58000b,0 0 0 8px #160609,0 22px 50px rgba(0,0,0,.8),0 0 55px rgba(255,31,59,.18);font-size:15px;letter-spacing:.08em;animation:breathe 2.6s ease-in-out infinite}.btn:before{content:"";position:absolute;inset:-18px;border:1px solid rgba(255,45,67,.09);border-radius:50%;animation:ring 2.6s ease-out infinite}.btn:active{transform:scale(.91);filter:brightness(1.15)}@keyframes breathe{50%{filter:brightness(1.1);box-shadow:0 0 75px rgba(255,31,59,.28)}}@keyframes ring{0%{transform:scale(.88);opacity:0}35%{opacity:1}100%{transform:scale(1.16);opacity:0}}.choices{gap:14px;flex-wrap:wrap;justify-content:center}.choice{box-shadow:inset 0 1px 2px rgba(255,255,255,.25),0 10px 30px rgba(0,0,0,.55);transition:.16s}.choice:active,.rect:active{transform:scale(.94)}.rect{background:linear-gradient(180deg,#171517,#0e0d0e);border:1px solid #292629;border-radius:18px;padding:17px 21px;min-width:124px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-weight:700;letter-spacing:.04em}.footer{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#494649;letter-spacing:.06em}.toast{bottom:110px;background:rgba(20,18,19,.92);backdrop-filter:blur(16px);border:1px solid #332e30;border-radius:999px;box-shadow:0 15px 45px #000;font-size:13px}.profile{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));border:1px solid #242124;padding:8px 22px 12px;border-radius:24px;margin:22px 0}.metric{margin:16px 0}.metricHead{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#a6a0a3}.metricHead b{color:#fff}.track{height:5px}.score{background:linear-gradient(90deg,#a4081b,#ff3b50);box-shadow:0 0 10px rgba(255,48,69,.35)}.archetype{font-size:38px;letter-spacing:-.05em}.again{border-radius:999px;padding:16px 28px;box-shadow:0 10px 35px rgba(0,0,0,.4)}.count{font-size:92px;letter-spacing:-.08em;text-shadow:0 0 35px rgba(255,255,255,.12)}@media(max-height:700px){.btn{width:125px;height:125px;margin-top:24px}.title{font-size:34px}.profile{margin:12px 0}.metric{margin:10px 0}}</style></head><body><main class='app'><div class='top'><span id='level'></span><div class='bar'><div class='fill' id='fill'></div></div></div><section class='stage' id='stage'><div class='eyebrow'>DON’T TAP</div><div class='title'>DON’T TAP</div><div class='sub'>Seriously. Don’t.</div><button class='btn' id='fallbackBtn' aria-label='Tap'></button></section><div class='footer' id='footer'>BEHAVIOR ENGINE // ACTIVE</div><div class='toast' id='toast'></div></main><script>
const stage=document.getElementById('stage'), levelEl=document.getElementById('level'), fill=document.getElementById('fill'), toast=document.getElementById('toast');
let n=-1,start=0,errors=0;const raw={impulsivity:50,patience:50,suspicion:50,attention:50,adaptability:50,risk:50};const history=[];
function clamp(x){return Math.max(5,Math.min(95,Math.round(x)))}function mod(k,v){raw[k]=clamp(raw[k]+v)}
function say(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),900)}
function shell(title,sub,body='',eyebrow=''){stage.innerHTML=`<div class='eyebrow'>${eyebrow}</div><div class='title'>${title}</div><div class='sub'>${sub}</div>${body}`;start=performance.now()}
function red(label='TAP'){return `<button class='btn' id='main'>${label}</button>`}
function next(ok=true,delay=500){history.push({n:n+1,rt:performance.now()-start,ok});if(!ok)errors++;setTimeout(()=>{n++;render()},delay)}
function tapMain(fn){document.getElementById('main').addEventListener('pointerdown',fn,{once:true})}
const traps=[
()=>{shell("DON'T TAP","Seriously. Don't.",red(''));levelEl.textContent='';fill.style.width='0';tapMain(()=>{let rt=performance.now()-start;mod('impulsivity',rt<1200?8:2);mod('risk',6);say('I literally told you not to.');next(true,800)})},
()=>{shell('Do it again.','Now that I asked, will you?',red('TAP'));tapMain(()=>{let rt=performance.now()-start;mod('suspicion',rt>1800?5:-2);next()})},
()=>{shell('Tap the GREEN button.','Seems easy, right?',`<div class='choices'><button class='choice red' data-c='r'></button><button class='choice green' data-c='g'></button><button class='choice blue' data-c='b'></button></div>`);stage.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.c==='g'){mod('attention',4);next()}else{mod('attention',-6);say('Wrong.');next(false,800)}})},
()=>{shell('Do NOT tap for 4 seconds.','Patience is data.',red('WAIT'));let safe=false,t=setTimeout(()=>{safe=true;document.getElementById('main').textContent='NOW'},4000);tapMain(()=>{clearTimeout(t);if(safe){mod('patience',7);mod('impulsivity',-4);next()}else{mod('patience',-9);mod('impulsivity',7);say('Couldn’t wait.');next(false,800)}})},
()=>{shell('Catch me.','You wanted to tap.',red(''));let b=document.getElementById('main'),moves=0;function move(){moves++;b.classList.add('move');b.style.left=(Math.random()*220-110)+'px';b.style.top=(Math.random()*260-130)+'px';if(moves<5)setTimeout(move,650)}move();tapMain(()=>{mod('adaptability',1);mod('attention',5);next()})},
()=>{shell('Tap the button on the LEFT.','Read carefully.',`<div class='choices'><button class='rect'>RIGHT</button><button class='rect'>LEFT</button></div>`);let bs=stage.querySelectorAll('.rect');bs.forEach((b,i)=>b.onclick=()=>{if(i===0){mod('attention',6);mod('suspicion',3);next()}else{mod('attention',-7);say('I said the button on the left.');next(false,900)}})},
()=>{shell('One tap only.','Exactly one.',red('TAP'));let b=document.getElementById('main'),c=0,t;b.addEventListener('pointerdown',()=>{c++;clearTimeout(t);t=setTimeout(()=>{if(c===1){mod('impulsivity',-2);next()}else{mod('impulsivity',7);next(false)}},500)})},
()=>{shell('This one is safe.','Probably.',red('TAP'));tapMain(()=>{let rt=performance.now()-start;mod('suspicion',rt>2200?6:-3);next()})},
()=>{shell('Tap when the number reaches 3.','Not before.',`<div class='count' id='count'>5</div>${red('TAP')}`);let c=5;let int=setInterval(()=>{c--;document.getElementById('count').textContent=c;if(c<=0)clearInterval(int)},800);tapMain(()=>{clearInterval(int);if(c===3){mod('attention',6);mod('patience',4);next()}else{mod('attention',-5);next(false)}})},
()=>{shell("Don't tap.",'I mean it this time.',red(''));let timer=setTimeout(()=>{mod('patience',7);next()},3500);tapMain(()=>{clearTimeout(timer);mod('suspicion',-4);mod('impulsivity',5);say('You still did it.');next(false,800)})},
()=>{shell('Tap the smallest button.','Size matters.',`<div class='choices'><button class='choice red' style='width:80px;height:80px'></button><button class='choice blue' style='width:42px;height:42px'></button><button class='choice green' style='width:62px;height:62px'></button></div>`);[...stage.querySelectorAll('.choice')].forEach((b,i)=>b.onclick=()=>{if(i===1){mod('attention',5);next()}else next(false)})},
()=>{shell('Choose quickly.','You have 1.2 seconds.',`<div class='choices'><button class='rect' data-x='1'>SAFE</button><button class='rect' data-x='2'>RISK</button></div>`);let done=false;let t=setTimeout(()=>{if(!done){mod('impulsivity',-3);mod('risk',-2);next(false)}},1200);stage.querySelectorAll('.rect').forEach(b=>b.onclick=()=>{done=true;clearTimeout(t);let rt=performance.now()-start;if(rt<700)mod('impulsivity',5);if(b.dataset.x==='2')mod('risk',7);else mod('risk',-3);next()})},
()=>{shell('Ignore the red button.','Tap the word “button”.',`${red('')}<button class='rect' id='word' style='margin-top:25px'>button</button>`);tapMain(()=>{mod('attention',-7);next(false)});document.getElementById('word').onclick=()=>{mod('attention',7);next()}},
()=>{shell('Wait.','I will tell you when.',red(''));let allowed=false;setTimeout(()=>{allowed=true;stage.querySelector('.sub').textContent='GO.'},2200);tapMain(()=>{if(allowed){mod('patience',5);next()}else{mod('patience',-7);next(false)}})},
()=>{shell('Tap the button.','It’s getting smaller…',red(''));let b=document.getElementById('main'),s=142;let int=setInterval(()=>{s-=12;b.style.width=s+'px';b.style.height=s+'px';if(s<35)clearInterval(int)},300);tapMain(()=>{clearInterval(int);let rt=performance.now()-start;if(rt<800)mod('impulsivity',4);mod('attention',4);next()})},
()=>{shell('Which do you trust?','The instruction, or your suspicion?',`<div class='choices'><button class='rect' data-v='obey'>OBEY</button><button class='rect' data-v='doubt'>DOUBT</button></div>`);stage.querySelectorAll('.rect').forEach(b=>b.onclick=()=>{if(b.dataset.v==='doubt')mod('suspicion',7);else mod('suspicion',-5);next()})},
()=>{shell('Tap twice.','No more. No less.',red('TAP'));let c=0,b=document.getElementById('main'),t;b.addEventListener('pointerdown',()=>{c++;clearTimeout(t);t=setTimeout(()=>{if(c===2){mod('attention',5);next()}else{mod('impulsivity',c>2?5:0);next(false)}},650)})},
()=>{let pred=raw.impulsivity>55?'FAST':'SLOW';shell("I've noticed something about you.",`I predict your next choice will be ${pred}.`,`<div class='choices'><button class='rect' data-v='fast'>FAST</button><button class='rect' data-v='slow'>SLOW</button></div>`);stage.querySelectorAll('.rect').forEach(b=>b.onclick=()=>{let correct=b.dataset.v===pred.toLowerCase();say(correct?'Predictable.':'Interesting. I was wrong.');mod('adaptability',correct?-2:6);next(true,900)})},
()=>{shell('Break the pattern.','Do something I won’t expect.',`<div class='choices'><button class='rect'>TAP</button><button class='rect'>WAIT</button></div>`);let bs=stage.querySelectorAll('.rect');bs[0].onclick=()=>{mod('adaptability',2);next()};bs[1].onclick=()=>{setTimeout(()=>{mod('patience',4);mod('adaptability',5);next()},1600)}},
()=>{shell('Last one.','Do you trust me now?',red('DON’T TAP'));let done=false;let t=setTimeout(()=>{if(!done){done=true;mod('patience',6);mod('suspicion',5);next()}},3500);tapMain(()=>{if(done)return;done=true;clearTimeout(t);mod('risk',5);mod('impulsivity',4);next()})}
];
function profile(){document.getElementById('footer').textContent='For entertainment — not a clinical or psychological diagnosis.';levelEl.textContent='BEHAVIOR PROFILE';fill.style.width='100%';let vals=raw;let arch=vals.impulsivity>62&&vals.suspicion>60?'THE FAST SKEPTIC':vals.patience>65?'THE WATCHER':vals.attention>70?'THE OBSERVER':vals.suspicion>68?'THE DOUBTER':'THE WILDCARD';let desc=arch==='THE FAST SKEPTIC'?"You question the game — but often act before you finish questioning it.":arch==='THE WATCHER'?"You’re willing to wait while other players create their own mistakes.":arch==='THE OBSERVER'?"Small details change your decisions more than pressure does.":arch==='THE DOUBTER'?"Once fooled, you rarely give an instruction the benefit of the doubt.":"Your choices resisted a clean pattern. For now.";let names={impulsivity:'IMPULSIVITY',patience:'PATIENCE',suspicion:'SUSPICION',attention:'ATTENTION',adaptability:'ADAPTABILITY',risk:'RISK'};stage.innerHTML=`<div class='eyebrow'>20 traps observed • ${errors} mistakes</div><div class='archetype'>${arch}</div><div class='small'>${desc}</div><div class='profile'>${Object.entries(vals).map(([k,v])=>`<div class='metric'><div class='metricHead'><span>${names[k]}</span><b>${v}</b></div><div class='track'><div class='score' style='width:${v}%'></div></div></div>`).join('')}</div><div class='small'>Profile confidence: 34%<br>More traps would make the game’s behavioral model more stable.</div><button class='again' onclick='location.reload()'>PLAY AGAIN</button>`}
function render(){if(n>=traps.length){profile();return}if(n<0)n=0;levelEl.textContent=n<3?'':`TRAP ${n+1} / ${traps.length}`;fill.style.width=n<3?'0%':`${(n/traps.length)*100}%`;traps[n]()}render();
</script></body></html>
