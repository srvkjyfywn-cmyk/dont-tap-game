<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050505"><title>DON'T TAP — Prediction Battle</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#f5f2ef;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{overflow:hidden}.app{height:100dvh;max-width:520px;margin:auto;padding:calc(env(safe-area-inset-top) + 22px) 25px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;position:relative;background:radial-gradient(circle at 50% 46%,#180c10 0,#090708 36%,#040404 68%)}.noise{position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);background-size:23px 23px}.top{height:30px;display:flex;align-items:center;gap:14px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;color:#5e595c}.progress{height:2px;background:#1e1a1c;flex:1}.fill{height:100%;width:0;background:#ff3049;box-shadow:0 0 12px #ff304988;transition:.35s}.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:in .3s ease}.kicker{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.25em;color:#ff5267;text-transform:uppercase;margin-bottom:14px}.title{font-size:clamp(38px,10vw,58px);font-weight:850;letter-spacing:-.06em;line-height:.94;max-width:420px;text-wrap:balance}.copy{margin-top:18px;color:#898386;font-size:16px;line-height:1.5;max-width:340px;min-height:48px}.primary{margin-top:35px;border:0;border-radius:999px;padding:17px 27px;background:#f4f0ed;color:#0b090a;font-weight:800;font-size:14px;letter-spacing:.04em}.red{background:#ff3049;color:#fff;box-shadow:0 0 45px #ff304933}.choices{display:flex;gap:13px;justify-content:center;flex-wrap:wrap;margin-top:32px}.choice{min-width:128px;padding:18px 20px;border:1px solid #302a2d;border-radius:18px;background:linear-gradient(#171416,#0e0d0e);color:#f4f1ef;font-weight:780;font-size:15px;box-shadow:0 14px 38px #0008}.choice:active,.primary:active{transform:scale(.95)}.lock{margin-top:22px;padding:10px 14px;border:1px solid #33282c;border-radius:999px;color:#8e8589;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.09em}.lock b{color:#ff5267}.big{font-size:88px;font-weight:900;letter-spacing:-.08em;line-height:1}.score{font-size:104px;font-weight:900;letter-spacing:-.09em;line-height:.9;color:#ff3b53;text-shadow:0 0 45px #ff304933}.card{width:100%;max-width:360px;margin-top:26px;padding:20px;border:1px solid #292326;border-radius:22px;background:#ffffff06;text-align:left}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #ffffff0a;color:#8c8588;font-size:13px}.row:last-child{border:0}.row b{color:#f5f2ef}.footer{height:45px;text-align:center;color:#4d484a;font:9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em}.flash{position:fixed;inset:0;background:#ff3049;opacity:0;pointer-events:none}.flash.go{animation:flash .28s ease}.result{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;color:#ff5267;margin-top:20px}@keyframes in{from{opacity:0;transform:translateY(8px) scale(.99)}}@keyframes flash{50%{opacity:.12}}@media(max-height:690px){.title{font-size:38px}.score{font-size:78px}.copy{margin-top:12px}.choices{margin-top:20px}.primary{margin-top:24px}.card{margin-top:16px;padding:14px}}
</style></head><body><div class="noise"></div><main class="app"><div class="top"><span id="phase">DON'T TAP</span><div class="progress"><div class="fill" id="fill"></div></div></div><section class="stage" id="stage"></section><div class="footer">PREDICTIONS ARE LOCKED BEFORE YOUR CHOICE</div></main><div class="flash" id="flash"></div><script>
const stage=document.getElementById('stage'),fill=document.getElementById('fill'),phase=document.getElementById('phase'),flash=document.getElementById('flash');
let round=0,start=0,correct=0,total=0,train=[],battle=[],bias={left:0,right:0,fast:0,slow:0,risk:0,safe:0,change:0,repeat:0};
function h(){if(navigator.vibrate)navigator.vibrate(16)}function pulse(){flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');h()}function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function screen(k,t,c,body='',button=''){stage.innerHTML=`<div class="kicker">${k}</div><div class="title">${t}</div><div class="copy">${c}</div>${body}${button?`<button class="primary red" id="primary">${button}</button>`:''}`;start=performance.now()}
function choices(a,fn){let box=document.createElement('div');box.className='choices';a.forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>{h();fn(x,performance.now()-start)};box.appendChild(b)});stage.appendChild(box)}
function intro(){phase.textContent="DON'T TAP";screen('PREDICTION BATTLE',"I BET I CAN PREDICT YOU.","Give me 10 choices. Then I'll lock my predictions before you act.",'', 'START');document.getElementById('primary').onclick=()=>{pulse();round=0;trainRound()}}
const trainDefs=[
['Pick one.','LEFT','RIGHT'],['Don’t think.','SAFE','RISK'],['Again.','LEFT','RIGHT'],['Choose.','RED','BLUE'],['Instinct only.','SAFE','RISK'],['Break your pattern.','LEFT','RIGHT'],['Which feels wrong?','YES','NO'],['Quick.','RED','BLUE'],['One more.','SAFE','RISK'],['Last calibration.','LEFT','RIGHT']
];
function learn(v,rt,prev){if(v==='LEFT')bias.left++;if(v==='RIGHT')bias.right++;if(v==='SAFE')bias.safe++;if(v==='RISK')bias.risk++;if(rt<900)bias.fast++;else bias.slow++;if(prev){if(v===prev)bias.repeat++;else bias.change++}}
function trainRound(){if(round>=10){reveal();return}phase.textContent=`LEARNING ${round+1}/10`;fill.style.width=(round*5)+'%';let d=trainDefs[round];screen('CALIBRATION',d[0],round<3?'Choose naturally.':round<7?'I’m starting to see it.':'Your pattern is getting clearer.');choices([d[1],d[2]],(v,rt)=>{let prev=train.length?train[train.length-1].v:null;learn(v,rt,prev);train.push({v,rt});round++;setTimeout(trainRound,170)})}
function reveal(){fill.style.width='50%';phase.textContent='MODEL READY';screen('10 CHOICES OBSERVED','I THINK I KNOW YOU NOW.',`Average decision: ${Math.round(avg(train.map(x=>x.rt)))} ms. Now I predict first. You choose second.`,'','BEGIN BATTLE');document.getElementById('primary').onclick=()=>{round=0;pulse();battleRound()}}
function predFor(type){if(type==='lr')return bias.left>=bias.right?'LEFT':'RIGHT';if(type==='risk')return bias.risk>=bias.safe?'RISK':'SAFE';if(type==='tempo')return bias.fast>=bias.slow?'FAST':'SLOW';if(type==='pattern')return bias.change>bias.repeat?'CHANGE':'REPEAT';return Math.random()>.5?'YES':'NO'}
const battles=[
{type:'lr',q:'Choose a side.',opts:['LEFT','RIGHT']},
{type:'risk',q:'Safe or risk?',opts:['SAFE','RISK']},
{type:'tempo',q:'Will you act fast?',opts:['FAST','SLOW']},
{type:'lr',q:'You know my model now.',opts:['LEFT','RIGHT']},
{type:'pattern',q:'Will you repeat your last instinct?',opts:['REPEAT','CHANGE']},
{type:'risk',q:'Under pressure?',opts:['SAFE','RISK']},
{type:'lr',q:'Try to fool me.',opts:['LEFT','RIGHT']},
{type:'tempo',q:'Hesitate or commit?',opts:['FAST','SLOW']},
{type:'risk',q:'I expect resistance.',opts:['SAFE','RISK']},
{type:'lr',q:'Final choice.',opts:['LEFT','RIGHT']}
];
function battleRound(){if(round>=battles.length){ending();return}let b=battles[round],p=predFor(b.type);phase.textContent=`BATTLE ${round+1}/10`;fill.style.width=(50+round*5)+'%';screen('PREDICTION LOCKED',b.q,`My prediction is already committed.`,`<div class="lock">I PREDICT <b>${p}</b></div>`);choices(b.opts,(v,rt)=>{let actual=v;if(b.type==='tempo')actual=rt<1050?'FAST':'SLOW';let hit=actual===p;total++;if(hit)correct++;battle.push({p,actual,hit,rt});pulse();let res=document.createElement('div');res.className='result';res.textContent=hit?'PREDICTED ✓':'YOU BEAT ME ×';stage.appendChild(res);stage.querySelectorAll('button').forEach(x=>x.disabled=true);if(b.type==='lr'){learn(actual,rt,battle.length>1?battle[battle.length-2].actual:null)}if(b.type==='risk')learn(actual,rt,null);round++;setTimeout(battleRound,850)})}
function ending(){fill.style.width='100%';phase.textContent='RESULT';let pct=Math.round(correct/total*100),label=pct>=80?'HIGHLY PREDICTABLE':pct>=60?'READABLE':pct>=40?'HARD TO READ':'CHAOTIC';screen('THE MACHINE VS YOU',label,`I predicted ${correct} of ${total} locked choices.`,`<div class="score">${pct}%</div><div class="card"><div class="row"><span>PREDICTIONS</span><b>${total}</b></div><div class="row"><span>CORRECT</span><b>${correct}</b></div><div class="row"><span>AVG RESPONSE</span><b>${Math.round(avg(battle.map(x=>x.rt)))} ms</b></div><div class="row"><span>YOU CHANGED PATTERN</span><b>${bias.change}×</b></div></div>`);let again=document.createElement('button');again.className='primary';again.textContent='PLAY AGAIN';again.onclick=()=>location.reload();stage.appendChild(again);let share=document.createElement('button');share.className='primary red';share.style.marginTop='12px';share.textContent='CHALLENGE A FRIEND';share.onclick=async()=>{let text=`DON'T TAP predicted me ${pct}% of the time. Can you beat me?`;if(navigator.share)try{await navigator.share({title:"DON'T TAP",text,url:location.origin+location.pathname})}catch(e){}else{await navigator.clipboard.writeText(text+' '+location.origin+location.pathname);share.textContent='LINK COPIED'}};stage.appendChild(share)}
intro();
</script></body></html>
